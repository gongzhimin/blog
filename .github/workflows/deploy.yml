name: Deploy Blog

on:
  push:
    branches: [ main ]
    paths:
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '15 22 * * *'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Update daily quote
        if: github.event_name == 'schedule'
        run: npm run update:daily-quote

      - name: Commit daily quote
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet -- src/data/daily-quote.json; then
            echo "Daily quote is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-quote.json
          git commit -m "chore: update daily quote"
          git push origin HEAD:main

      - name: Build
        run: npm run build

      - name: Create dist directory on server
        uses: appleboy/ssh-action@master
        with:
          host: 13.193.240.51
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            mkdir -p /var/www/blog/dist

      - name: Deploy with rsync
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/blog/dist/
          remote_host: 13.193.240.51
          remote_user: ubuntu
          remote_key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Verify public homepage
        run: curl -fsS --max-time 15 https://zhimin.ink/ >/dev/null
