name: Verify and Deploy Webhook
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blog-webhook-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
  deploy-webhook:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload entry points and module implementations
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.193.240.51
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: 'packages,package.json,package-lock.json'
          target: /tmp/blog-webhook-deploy
      - name: Install modules and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 13.193.240.51
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -eu
            sudo install -d -o ubuntu -g ubuntu /var/www/blog/packages
            sudo cp -R /tmp/blog-webhook-deploy/packages/. /var/www/blog/packages/
            sudo install -m 0644 -o ubuntu -g ubuntu /tmp/blog-webhook-deploy/package.json /var/www/blog/package.json
            sudo install -m 0644 -o ubuntu -g ubuntu /tmp/blog-webhook-deploy/package-lock.json /var/www/blog/package-lock.json
            cd /var/www/blog
            PUPPETEER_SKIP_DOWNLOAD=1 npm ci --omit=dev
            sudo install -m 0644 /tmp/blog-webhook-deploy/packages/operations/src/assets/blog-webhook.service /etc/systemd/system/blog-webhook.service
            sudo systemctl daemon-reload
            sudo systemctl restart blog-webhook.service
            node /var/www/blog/packages/operations/src/cli/health.cjs
